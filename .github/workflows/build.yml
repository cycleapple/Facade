name: Build API 13 zh-TW

on:
  push:
    branches: [api13-tw]
  pull_request:
    branches: [api13-tw]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Download pinned TC API 13 runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.7z'
          $runtime = Join-Path $env:RUNNER_TEMP 'dalamud-api13'
          Invoke-WebRequest 'https://github.com/yanmucorp/Dalamud/releases/download/26-07-28-02/latest.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '9CBE2EBC5287B7CEAF1C5D8EAEA41135324809EBFCB921819480201634CBFB96') {
            throw 'Pinned Dalamud archive checksum mismatch'
          }
          & 7z x $archive "-o$runtime" -y -bso0
          if ($LASTEXITCODE -ne 0) { throw 'Dalamud extraction failed' }
          "DALAMUD_HOME=$runtime" >> $env:GITHUB_ENV
      - name: Restore locked dependencies
        run: dotnet restore Facade.csproj --locked-mode
      - name: Build Debug
        run: dotnet build Facade.csproj -c Debug --no-restore
      - name: Build Release
        run: dotnet build Facade.csproj -c Release --no-restore
      - name: Regression checks
        run: dotnet run --project tests/Facade.SmokeTests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Facade-API13-zh-TW
          path: bin/Release/Facade/latest.zip
          if-no-files-found: error
